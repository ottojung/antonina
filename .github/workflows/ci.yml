name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.10.12"
      - name: Sync
        run: uv sync --frozen --extra dev
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy .
      - name: Tests
        run: uv run pytest

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web toolchain
        run: npm ci --prefix web
      - name: Typecheck shared core
        run: ./web/node_modules/.bin/tsc -p packages/core/tsconfig.json
      - name: Typecheck agent runtime
        run: ./web/node_modules/.bin/tsc -p packages/agent-runtime/tsconfig.json
      - name: Typecheck CLI
        run: ./web/node_modules/.bin/tsc -p packages/cli/tsconfig.json
      - name: Core tests
        run: node --test packages/core/test/*.test.mjs
      - name: Agent runtime tests
        run: node --test packages/agent-runtime/test/*.test.mjs
      - name: CLI tests
        run: node --test packages/cli/test/*.test.mjs
      - name: Web tests
        run: npm test --prefix web
      - name: Web build
        run: npm run build --prefix web
