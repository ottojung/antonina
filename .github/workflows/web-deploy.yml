name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/core/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app ghcr.io/ottojung/skrynia-builder:1.0.0-122-g9829feb make build
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app ghcr.io/ottojung/skrynia-builder:1.0.0-122-g9829feb npm test --prefix web
      - name: Deploy
        uses: ottojung/Skrynia/action/deploy@14ed0b8e154a3a74e614fd0b86e790fe346a5a74
        with:
          namespace: antonina
          skrynia-url: https://vau.place/_skrynia
          subdir: .
          builder: ghcr.io/ottojung/skrynia-builder:1.0.0-122-g9829feb
          token: ${{ secrets.SKRYNIA_TOKEN }}
      - name: Smoke test
        # A functional probe, not a status code. `curl --fail` on index.html
        # passes for a deployment whose board cannot be loaded at all, which is
        # what the 0.1.1 rollout was: the page was served and the board was
        # not readable. Board issue 74. scripts/deploy-smoke.mjs drives headless
        # Chromium against the deployed URL and requires the application to
        # start, the board to load *and verify* against the public trust anchor
        # in ANTONINA_BOARD_TRUST_ANCHOR, the issue list to be populated and the
        # feed to be populated, and it prints the application's own error text
        # when it is not.
        #
        # Read-only by construction: the probe only navigates and reads. It
        # stores a public trust anchor in a throwaway browser profile, submits no
        # form, and never holds a board credential.
        #
        # ANTONINA_BOARD_TRUST_ANCHOR is the board's *public trust anchor*: the
        # single-line JSON `antonina board credential trust` prints, of exactly
        # the shape {boardId, rootKeyId, rootPublicKey}.
        #
        # It is NOT the contents of $XDG_CONFIG_HOME/antonina/trust.json, which
        # is the whole local credential store rather than one anchor, and it is
        # not the board credential itself. This used to say otherwise and the
        # probe's own shape check (checkTrustAnchorShape) would have rejected
        # trust.json — so the two disagreed, and a secret set that way would have
        # failed the deploy with a message about the required key set rather than
        # about what to paste. The check is reject-only and runs before the
        # browser starts, so a wrong secret fails loudly and immediately.
        #
        # Without an anchor the probe cannot ask the app to verify anything, so
        # the guard below fails the deploy rather than passing a board nobody
        # read. That is deliberate: a smoke test that silently degrades to a
        # status check is the bug this step exists to fix.
        #
        # This step runs *after* Deploy, so a red probe marks the run but does
        # not stop the bundle that was just published. The verdict is therefore
        # written to the run page as well as to the log: an operator opening a
        # failed run learns what was published and what the board said about
        # itself, not only that a step went red.
        env:
          ANTONINA_BOARD_TRUST_ANCHOR: ${{ secrets.ANTONINA_BOARD_TRUST_ANCHOR }}
        run: |
          set -euo pipefail
          if [ -z "${ANTONINA_BOARD_TRUST_ANCHOR:-}" ]; then
            echo "ERROR: ANTONINA_BOARD_TRUST_ANCHOR is not set. The smoke test cannot read and verify the board without it, and it refuses to pass a board it did not read." >&2
            echo "Set the repository secret to the board's public trust anchor (antonina board credential trust)." >&2
            printf '## Smoke test\n\n**SMOKE FAILED** — no trust anchor configured, so the board was never read.\n\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          curl --fail --retry 5 --retry-delay 5 https://vau.place/_skrynia/health
          if output="$(node scripts/deploy-smoke.mjs --url https://vau.place/a/antonina/ --min-issues 1 --min-feed 1 2>&1)"; then
            printf '## Smoke test\n\n```\n%s\n```\n' "$output" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$output"
          else
            status=$?
            # The probe's own words, verbatim, on the run page. A smoke test that
            # can silently degrade is the bug this step exists to fix, so its
            # failure text is what the operator is shown.
            printf '## Smoke test\n\n**SMOKE FAILED** (exit %s) — this build is live; the board could not be read.\n\n```\n%s\n```\n' "$status" "$output" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
