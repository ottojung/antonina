name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify build
        run: docker run --rm -v "$PWD/web:/app" -w /app ghcr.io/ottojung/skrynia-builder:1.0.0-122-g9829feb npm ci && docker run --rm -v "$PWD/web:/app" -w /app ghcr.io/ottojung/skrynia-builder:1.0.0-122-g9829feb npm test && docker run --rm -v "$PWD/web:/app" -w /app ghcr.io/ottojung/skrynia-builder:1.0.0-122-g9829feb npm run build
      - name: Deploy
        uses: ottojung/Skrynia/action/deploy@14ed0b8e154a3a74e614fd0b86e790fe346a5a74
        with:
          namespace: antonina
          skrynia-url: https://vau.place/_skrynia
          subdir: web
          builder: ghcr.io/ottojung/skrynia-builder:1.0.0-122-g9829feb
          token: ${{ secrets.SKRYNIA_TOKEN }}
      - name: Smoke test
        run: |
          curl --fail --retry 5 --retry-delay 5 https://vau.place/a/antonina/
          curl --fail --retry 5 --retry-delay 5 https://vau.place/_skrynia/health
